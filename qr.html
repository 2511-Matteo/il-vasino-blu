<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il Vasino Blu - Info</title>
    <style>
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            text-align: center; 
            background-color: #f8fbff; 
            padding: 40px 20px; 
            margin: 0; 
            color: #333;
        }
        .container { max-width: 400px; margin: 0 auto; }
        .logo { 
            width: 110px; 
            height: 110px; 
            border-radius: 50%; 
            border: 5px solid white; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.1); 
            margin-bottom: 20px;
        }
        h1 { font-size: 1.8em; color: #0056b3; margin-bottom: 10px; }
        p { font-size: 1.1em; color: #666; margin-bottom: 35px; }
        
        .link-button { 
            display: block; 
            width: 100%; 
            padding: 18px; 
            margin: 15px 0; 
            background-color: #007bff; 
            color: white; 
            text-decoration: none; 
            border-radius: 15px; 
            font-weight: bold; 
            font-size: 1.1em; 
            box-shadow: 0 4px 10px rgba(0,123,255,0.3);
            transition: all 0.3s ease;
        }
        
        /* Color especial para Instagram */
        .instagram { 
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%); 
            box-shadow: 0 4px 10px rgba(228,64,95,0.3); 
        }
        
        .footer { margin-top: 50px; font-size: 0.9em; color: #bbb; }
    </style>
</head>
<body>
    <div class="container">
        <img src="Matteo-circulo.png" alt="Il Vasino Blu" class="logo">
        
        <h1>Il Vasino Blu</h1>
        <p>Tutto il mondo di Matteo in un click!</p>
        
        <a href="#" class="link-button" target="_blank">📖 Acquista il Libro</a>
        
        <a href="index.html" class="link-button" target="_blank">🌐 Visita il Sito Web</a>
        
        <a href="https://www.instagram.com/matteo.storie/" class="link-button instagram" target="_blank">📸 Seguimi su Instagram</a>

        <div class="footer">Realizzato con ❤️ per Matteo</div>
    </div>
</body>
</html>
